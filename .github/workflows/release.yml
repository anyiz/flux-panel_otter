name: Publish Flux Otter release

on:
  push:
    tags:
      - '*-otter.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-gost/go.mod
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum

      - name: Check installer release URLs
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh panel_install.sh
          grep -F "releases/download/${GITHUB_REF_NAME}/gost-" install.sh
          grep -F "releases/download/${GITHUB_REF_NAME}" panel_install.sh
          grep -F "FLUX_IMAGE_TAG=\"${GITHUB_REF_NAME}\"" panel_install.sh

      - name: Build Linux GOST binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd go-gost && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "../dist/gost-$arch" .)
          done
          (cd dist && sha256sum gost-amd64 gost-arm64 > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/gost-amd64 dist/gost-arm64 dist/SHA256SUMS \
            install.sh panel_install.sh \
            docker-compose-v4.yml docker-compose-v6.yml gost.sql \
            doc/migrations/20261111_proxy_protocol.sql \
            --verify-tag \
            --title "Flux Otter $GITHUB_REF_NAME" \
            --notes-file doc/release-notes-1.4.3-otter.2.md
